<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --line: #2c313c;
    --text: #e8eaf0; --muted: #8b93a3; --accent: #7c5cff; --accent2: #5b3fe0;
    --ok: #3ecf8e; --warn: #f5a524; --bad: #ff5d6c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 14px 28px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .logo { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 6px; }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 14px; border-radius: 8px;
               cursor: pointer; font: inherit; }
  nav button.active, nav button:hover { background: var(--panel2); color: var(--text); }
  .pill { margin-left: auto; font-size: 13px; color: var(--muted); background: var(--panel2);
          padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .grow { flex: 1; }
  button.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
               font: inherit; font-weight: 600; cursor: pointer; }
  button.btn:hover { background: var(--accent2); }
  button.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .proj { display: flex; align-items: center; gap: 16px; padding: 14px 18px; cursor: pointer; }
  .proj:hover { border-color: var(--accent); }
  .proj .title { font-weight: 600; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
  .badge.done { color: var(--ok); } .badge.failed { color: var(--bad); }
  .badge.running, .badge.queued { color: var(--warn); } .badge.cancelled { color: var(--muted); }
  .bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .clip video { width: 100%; border-radius: 8px; background: #000; max-height: 260px; }
  .score { font-weight: 700; padding: 2px 10px; border-radius: 8px; background: var(--panel2); }
  .providers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .prov { border: 2px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer; background: var(--panel); }
  .prov.sel { border-color: var(--accent); background: #1c1936; }
  .prov h3 { margin: 0 0 4px; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .err { color: var(--bad); background: #2a1519; border: 1px solid #4a2028; padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
  .hidden { display: none; }
  .tr { max-height: 320px; overflow: auto; font-size: 14px; }
  .tr p { margin: 0 0 6px; } .tr b { color: var(--accent); font-weight: 500; font-size: 12px; margin-right: 8px; }
  .clip video { width: 100%; max-height: 440px; border-radius: 8px; background: #000; object-fit: contain; }
  a.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px 18px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; }
  a.btn:hover { border-color: var(--accent); }
  .tag { font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .style-grid { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .style-controls { flex: 1; min-width: 300px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 16px; }
  .style-controls .field { margin-top: 8px; }
  .toggles { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  input[type=color] { padding: 2px; height: 40px; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  details summary { cursor: pointer; font-weight: 600; }
  .pv { width: 150px; position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); flex: none;
        background: linear-gradient(160deg, #6a5a9a, #2a3a5e 55%, #4a3030); }
  .pv .cap { position: absolute; left: 5%; right: 5%; text-align: center; line-height: 1.15; padding: 2px 4px; border-radius: 4px; }
  .pv .hookpv { position: absolute; left: 12%; right: 12%; text-align: center; background: #fff; color: #000; font-weight: 800;
                padding: 3px 5px; border-radius: 3px; display: none; }
  .pv .barpv { position: absolute; left: 0; bottom: 0; height: 4px; width: 60%; display: none; }
  .pv .wmpv { position: absolute; width: 26%; height: 9%; background: #c0f; border-radius: 2px; display: none; }
  .pvnote { font-size: 12px; color: var(--muted); max-width: 150px; margin-top: 6px; }
  .vwrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; line-height: 0; }
  .vwrap video { width: 100%; height: auto; max-height: 60vh; display: block; }
  .cropbox { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none; }
  .ed-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .ed-grid { grid-template-columns: 1fr; } }
  .tlbar { position: relative; height: 54px; background: var(--panel2); border-radius: 8px; border: 1px solid var(--line); touch-action: none; cursor: pointer; user-select: none; }
  .tlsel { position: absolute; top: 0; bottom: 0; background: rgba(124,92,255,.28); border-left: 3px solid var(--accent); border-right: 3px solid var(--accent); }
  .tlh { position: absolute; top: -4px; bottom: -4px; width: 14px; margin-left: -7px; background: var(--accent); border-radius: 5px; cursor: ew-resize; z-index: 2; }
  .tlplay { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 1; pointer-events: none; }
  .tlbr { position: absolute; bottom: 0; height: 8px; background: var(--warn); border-radius: 2px; pointer-events: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 240px; overflow: auto; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; padding: 2px 8px; font: inherit; cursor: pointer; }
  .chip.sel { outline: 2px solid var(--accent); }
  .chip.cut { text-decoration: line-through; color: var(--bad); }
  .chip.hid { opacity: .45; font-style: italic; }
  .chip.edt { border-color: var(--accent); }
  .brl { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .brl img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; }
  textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; width: 100%; }
  .hc { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="logo">Clip<span>Forge</span></div>
  <nav>
    <button id="nav-projects" class="active" onclick="go('projects')">Projects</button>
    <button id="nav-settings" onclick="go('settings')">Settings</button>
  </nav>
  <div class="pill" id="activeModel">…</div>
</header>
<main id="view"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const api = async (path, opts = {}) => {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
};
const json = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const fmt = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STAGES = { queued: 'Waiting in queue', ingest: 'Getting video', transcribe: 'Transcribing speech',
                 highlights: 'Finding best moments', export: 'Cutting clips', render: 'Styling clips', done: 'Done' };
let timer = null, current = { view: 'projects', id: null }, SETTINGS = null, PROVIDERS = [];

async function loadSettings() {
  const d = await api('/settings');
  SETTINGS = d.settings; PROVIDERS = d.providers;
  const p = PROVIDERS.find(p => p.id === SETTINGS.llm_provider);
  $('#activeModel').textContent = 'AI: ' + (p ? p.label : SETTINGS.llm_provider);
}

function go(view, id = null) {
  clearInterval(timer);
  current = { view, id };
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  $('#nav-' + (view === 'settings' ? 'settings' : 'projects')).classList.add('active');
  ({ projects: viewProjects, project: viewProject, settings: viewSettings, editor: viewEditor })[view]();
}

/* ---------------- projects list ---------------- */
async function viewProjects() {
  $('#view').innerHTML = `
    <h1>New project</h1>
    <div class="card">
      <div class="field" style="margin-top:0"><label>Video links (one per line, they are processed in order)</label>
        <textarea id="url" rows="2" placeholder="Paste one or more YouTube or video links"></textarea></div>
      <div class="row" style="margin-top:12px">
        <span class="muted small">and/or files:</span>
        <input id="file" type="file" accept="video/*" multiple>
      </div>
      <div class="field"><label>Optional: what should the clips be about? (e.g. "moments about pricing", "funny stories")</label>
        <input id="focus" type="text" maxlength="200" placeholder="Leave empty to let the AI pick the best moments"></div>
      <div class="row" style="margin-top:14px"><button class="btn" onclick="submitNew()">Find clips</button></div>
      <div id="newErr"></div>
    </div>
    <div class="row" style="margin-bottom:12px"><h1 style="margin:0" class="grow">Projects</h1>
      <button class="btn ghost" onclick="queueAct('retry-failed')">Retry failed</button>
      <button class="btn ghost" onclick="queueAct('cancel-all')">Cancel all</button></div>
    <div id="list"></div>`;
  const draw = async () => {
    const list = await api('/projects');
    $('#list').innerHTML = list.length ? list.map(p => `
      <div class="card proj" onclick="go('project','${p.id}')">
        <div class="grow"><div class="title">${esc(p.title)}</div>
          <div class="muted small">${p.duration ? fmt(p.duration) + ' · ' : ''}${p.created_at}${p.focus ? ' · focus: ' + esc(p.focus) : ''}</div></div>
        ${p.status === 'running' || p.status === 'queued'
          ? `<div style="width:170px"><div class="bar"><i style="width:${p.progress * 100}%"></i></div>
             <div class="muted small">${p.queue_position > 0 ? 'Number ' + p.queue_position + ' in the queue' : (STAGES[p.stage] || p.stage)}</div></div>
             <button class="btn danger" onclick="event.stopPropagation(); cancelOne('${p.id}')">Cancel</button>` : ''}
        <span class="badge ${p.status}">${p.status}</span>
      </div>`).join('') : '<p class="muted">No projects yet. Paste a link above to start.</p>';
  };
  draw(); timer = setInterval(draw, 2500);
}
async function cancelOne(id) { await api(`/projects/${id}/cancel`, json('POST', {})); }
async function queueAct(what) {
  const d = await api('/queue/' + what, json('POST', {}));
  if (what === 'cancel-all' && !d.cancelled) alert('Nothing is running or waiting.');
  if (what === 'retry-failed' && !d.retried) alert('No failed projects.');
}
async function submitNew() {
  const urls = $('#url').value.split('\n').map(x => x.trim()).filter(Boolean);
  const files = [...$('#file').files], focus = $('#focus').value;
  if (!urls.length && !files.length) { $('#newErr').innerHTML = '<div class="err">Paste a link or choose a video file first.</div>'; return; }
  const ids = [], errs = [];
  for (const item of [...urls, ...files]) {
    const fd = new FormData();
    typeof item === 'string' ? fd.append('url', item) : fd.append('file', item);
    fd.append('focus', focus);
    try { ids.push((await api('/projects', { method: 'POST', body: fd })).id); }
    catch (e) { errs.push((typeof item === 'string' ? item : item.name) + ': ' + e.message); }
  }
  if (errs.length) { $('#newErr').innerHTML = errs.map(m => `<div class="err">${esc(m)}</div>`).join(''); if (!ids.length) return; }
  if (ids.length === 1 && !errs.length) go('project', ids[0]);
  else if (!errs.length) go('projects');
}

/* ---------------- one project ---------------- */
async function viewProject() {
  const id = current.id;
  try { KITS = await api('/kits'); } catch { KITS = []; }
  $('#view').innerHTML = '<div id="p"></div>';
  const draw = async () => {
    let p; try { p = await api('/projects/' + id); } catch { return go('projects'); }
    const busy = p.status === 'running' || p.status === 'queued';
    const opts = PROVIDERS.map(x => `<option value="${x.id}" ${x.id === SETTINGS.llm_provider ? 'selected' : ''}>${esc(x.label)}</option>`).join('');
    $('#p').innerHTML = `
      <div class="row" style="margin-bottom:16px">
        <button class="btn ghost" onclick="go('projects')">← Back</button>
        <h1 class="grow" style="margin:0">${esc(p.title)}</h1>
        <span class="badge ${p.status}">${p.status}</span>
      </div>
      ${busy ? `<div class="card"><div class="row"><div class="grow">
          <div class="bar"><i style="width:${p.progress * 100}%"></i></div>
          <div class="muted small" style="margin-top:6px">${STAGES[p.stage] || p.stage} · ${Math.round(p.progress * 100)}%</div></div>
          <button class="btn danger" onclick="act('cancel')">Cancel</button></div></div>` : ''}
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ''}
      ${!busy ? `<div class="card"><div class="row">
          <span class="muted">Re-pick clips with:</span>
          <select id="rerunProv">${opts}</select>
          <button class="btn ghost" onclick="act('rerun', document.getElementById('rerunProv').value)">Run again</button>
          <span class="grow"></span>
          <button class="btn danger" onclick="del()">Delete project</button></div>
          <div class="field"><label>Focus (optional): what should the clips be about?</label>
            <input type="text" id="rerunFocus" maxlength="200" value="${esc(p.focus || '')}" placeholder="e.g. moments about pricing. Empty = best moments overall"></div>
          <div class="muted small" style="margin-top:8px">Reuses the existing transcript, so switching models is quick.${p.provider_used ? ' Last run used: ' + esc(p.provider_used) + '.' : ''}</div></div>` : ''}
      ${!busy && p.clips.length ? `<details class="card" ontoggle="updatePreview('rs_')">
          <summary>Restyle clips (shape, captions, cleanup, overlays)</summary>
          <p class="muted small">Re-renders from the original video and reuses the transcript and the AI's picks, so it is much faster than starting over.</p>
          ${KITS.length ? `<div class="field"><label>Start from a brand kit</label><select id="rs_kit">
            <option value="">None (use the choices below)</option>${KITS.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select>
            <span class="muted small">A kit replaces the style choices below, apart from anything you change after picking it.</span></div>` : ''}
          ${styleBlock('rs_', SETTINGS)}
          <div class="row" style="margin-top:16px"><button class="btn" onclick="restyle(null)">Re-render all clips</button>
            <span class="muted small">Your logo is managed in Settings.</span></div></details>` : ''}
      ${!busy && p.clips.some(c => c.file && !c.error) ? `<div class="card"><div class="row">
          <a class="btn" href="/api/projects/${p.id}/zip">Download all clips (.zip with subtitles)</a>
          <span class="grow"></span>
          <input type="text" id="exportDir" style="width:300px" placeholder="Folder, e.g. C:\\Users\\you\\Videos\\clips">
          <button class="btn ghost" onclick="exportFolder()">Save to folder</button></div>
          <div id="exportMsg" class="small" style="margin-top:6px"></div></div>` : ''}
      <div class="clips">${p.clips.map(c => clipCard(p, c, busy)).join('')}</div>
      <div id="tr"></div>`;
    if (!busy) { clearInterval(timer); loadTranscript(id); updatePreview('rs_'); }
  };
  await draw(); timer = setInterval(draw, 2000);
}
async function loadTranscript(id) {
  try {
    const t = await api(`/projects/${id}/transcript`);
    $('#tr').innerHTML = `<div class="card"><h2>Transcript (${esc(t.language)}, ran on ${esc(t.device)})</h2>` +
      (t.gpu_error ? `<div class="err small">The GPU could not be used, so the CPU did the work (slower). Reason: ${esc(t.gpu_error)}</div>` : '') +
      `<div class="tr">` +
      t.segments.map(s => `<p><b>${fmt(s.start)}</b>${esc(s.text)}</p>`).join('') + '</div></div>';
  } catch {}
}
let KITS = [];
async function act(what, provider) {
  const body = provider ? { provider } : {};
  if (what === 'rerun') body.focus = ($('#rerunFocus') || { value: '' }).value;
  await api(`/projects/${current.id}/${what}`, json('POST', body));
  go('project', current.id);
}
async function exportFolder() {
  const msg = $('#exportMsg'); msg.innerHTML = '<span class="muted">Copying…</span>';
  try { const d = await api(`/projects/${current.id}/export-folder`, json('POST', { folder: $('#exportDir').value }));
        msg.innerHTML = `<span class="ok">Saved ${d.count} clip(s) with subtitles to ${esc(d.folder)}</span>`; }
  catch (e) { msg.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
async function del() {
  if (!confirm('Delete this project and all its clips?')) return;
  await api('/projects/' + current.id, { method: 'DELETE' }); go('projects');
}

/* ---------------- settings & model switching ---------------- */
async function viewSettings() {
  await loadSettings();
  const s = SETTINGS;
  const secret = (id, label, key) => `
    <div class="field"><label>${label}</label>
      <div class="row"><input id="${id}" type="password" class="grow" autocomplete="off"
        placeholder="${s[key + '_set'] ? 'Saved (' + s[key + '_hint'] + ') — leave blank to keep' : 'Paste API key'}">
        ${s[key + '_set'] ? `<button class="btn ghost" onclick="clearKey('${key === 'anthropic_api_key' ? 'claude' : 'gemini'}')">Remove</button>` : ''}</div></div>`;
  $('#view').innerHTML = `
    <h1>AI model</h1>
    <p class="muted">Choose which model finds your clips. Switch any time; keys are stored only on this computer.</p>
    <div class="providers">
      ${PROVIDERS.map(p => `<div class="prov ${s.llm_provider === p.id ? 'sel' : ''}" onclick="pick('${p.id}')" id="prov-${p.id}">
        <h3>${esc(p.label)}</h3>
        <div class="muted small">${{ claude: 'Best quality. Needs API key + internet.', gemini: 'Fast, large context. Needs API key + internet.', ollama: 'Runs on your PC. No key, fully offline, slower on 4 GB GPU.' }[p.id]}</div>
      </div>`).join('')}
    </div>
    <input type="hidden" id="llm_provider" value="${esc(s.llm_provider)}">

    <div class="card" style="margin-top:18px" id="cfg-claude">
      <h2>Claude</h2>${secret('anthropic_api_key', 'Anthropic API key', 'anthropic_api_key')}
      <div class="field"><label>Model</label><input id="anthropic_model" type="text" value="${esc(s.anthropic_model)}"></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="testProv('claude')">Test connection</button><span id="t-claude"></span></div>
    </div>
    <div class="card" id="cfg-gemini">
      <h2>Gemini</h2>${secret('gemini_api_key', 'Gemini API key', 'gemini_api_key')}
      <div class="field"><label>Model</label><input id="gemini_model" type="text" value="${esc(s.gemini_model)}"></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="testProv('gemini')">Test connection</button><span id="t-gemini"></span></div>
    </div>
    <div class="card" id="cfg-ollama">
      <h2>Ollama (local)</h2>
      <div class="field"><label>Server address</label><input id="ollama_base_url" type="text" value="${esc(s.ollama_base_url)}"></div>
      <div class="field"><label>Model</label>
        <div class="row"><select id="ollama_model_sel" class="grow" onchange="$('#ollama_model').value=this.value"></select>
        <button class="btn ghost" onclick="loadOllama()">Refresh list</button></div>
        <input id="ollama_model" type="text" value="${esc(s.ollama_model)}" placeholder="or type a model name, e.g. llama3.1:8b"></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="testProv('ollama')">Test connection</button><span id="t-ollama"></span></div>
    </div>

    <h1>How finished clips look</h1>
    <p class="muted">These are the defaults for every new project. You can restyle any project later without re-running the AI.</p>
    <div class="card">
      ${styleBlock('', s)}
      <div class="row" style="margin-top:18px">
        ${s.watermark_set ? `<img src="/api/brand/logo?${Date.now()}" alt="logo" style="height:40px;border-radius:6px;background:#333">` : '<span class="muted small">No logo uploaded yet</span>'}
        <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp">
        <button class="btn ghost" onclick="uploadLogo()">Upload logo</button>

function updatePreview(p) {
  const box = document.getElementById(p + 'pv'); if (!box) return;
  const v = k => readVal(p + k), aspect = v('output_aspect');
  box.style.aspectRatio = ({ '9:16': '9/16', '1:1': '1/1', '4:5': '4/5', original: '16/9' })[aspect] || '9/16';
  box.style.width = aspect === 'original' ? '240px' : '150px';
  const w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
  const unit = Math.min(w, h * 0.75), vertical = h >= w * 1.2, st = v('caption_style');
  const spec = { bold: [.098, 900, 1], pop: [.105, 900, 1], classic: [.072, 700, 0], karaoke: [.078, 700, 0], minimal: [.056, 400, 0] }[st];
  const cap = box.querySelector('.cap');
  cap.style.display = spec ? 'block' : 'none';
  if (spec) {
    const hl = v('highlight_color'), ac = v('accent_color'), pos = v('caption_position');
    cap.style.fontSize = (spec[0] * unit) + 'px'; cap.style.fontWeight = spec[1];
    cap.style.textTransform = spec[2] ? 'uppercase' : 'none';
    cap.style.color = v('caption_color');
    cap.style.background = st === 'minimal' ? 'rgba(0,0,0,.55)' : 'none';
    cap.style.textShadow = st === 'minimal' ? 'none' : '0 0 2px #000, 0 0 3px #000, 1px 1px 2px #000';
    cap.innerHTML = st === 'minimal' ? 'Stop scrolling and watch this'
      : st === 'karaoke' ? `<span style="color:${hl}">Stop scroll</span>ing and watch`
      : `Stop <span style="color:${hl}">scrolling</span> <span style="color:${ac}">$500</span>`;
    cap.style.top = cap.style.bottom = cap.style.transform = '';
    if (pos === 'center') { cap.style.top = '50%'; cap.style.transform = 'translateY(-50%)'; }
    else if (pos === 'top') cap.style.top = (h * (vertical ? .25 : .15)) + 'px';
    else cap.style.bottom = (h * (vertical ? .20 : aspect === '1:1' || aspect === '4:5' ? .10 : .08)) + 'px';
  }
  const hook = box.querySelector('.hookpv');
  hook.style.display = v('hook_title') === 'on' ? 'block' : 'none';
  hook.style.fontSize = (.06 * unit) + 'px'; hook.style.top = (h * (vertical ? .09 : .06)) + 'px';
  const bar = box.querySelector('.barpv');
  bar.style.display = v('progress_bar') === 'on' ? 'block' : 'none'; bar.style.background = v('progress_color');
  const wm = box.querySelector('.wmpv'), m = (w * .04) + 'px', pos = v('watermark_position');
  wm.style.display = v('watermark') === 'on' ? 'block' : 'none';
  wm.style.width = (Math.min(Math.max(parseFloat(v('watermark_scale')) || .16, .05), .5) * 100) + '%';
  wm.style.opacity = Math.min(Math.max(parseFloat(v('watermark_opacity')) || .85, .1), 1);
  wm.style.top = wm.style.bottom = wm.style.left = wm.style.right = '';
  wm.style[pos[0] === 't' ? 'top' : 'bottom'] = m; wm.style[pos[1] === 'l' ? 'left' : 'right'] = m;
  if (p === 'ed_' && ED) drawCrop();
}

function clipCard(p, c, busy) {
  const head = `<div class="row" style="margin-top:12px"><b class="grow">${esc(c.title)}</b><span class="score">${c.score}</span></div>
    <div class="muted small">${fmt(c.start)} – ${fmt(c.end)} in the source · ${esc(c.provider)}</div>`;
  const redo = busy ? '' : `<button class="btn ghost" onclick="restyle(${c.id})">Restyle this clip</button>`;
  const edit = busy ? '' : `<button class="btn" onclick="go('editor', ${c.id})">Edit</button>`;
  if (c.error) return `<div class="card clip">${head}<div class="err">Render failed: ${esc(c.error)}</div><div class="row">${edit}${redo}</div></div>`;
  if (!c.rendered_at && !c.error) return `<div class="card clip"><div class="muted" style="padding:60px 0;text-align:center">Rendering this clip…</div>${head}</div>`;
  const url = `/media/${p.id}/clips/${encodeURIComponent(c.file)}?v=${c.rendered_at || 0}`;
  const name = (c.title || 'clip').replace(/[^\w\- ]+/g, '').trim().slice(0, 60) || 'clip';
  const secs = c.out_seconds || (c.end - c.start);
  const tags = [c.layout && c.layout !== 'original' ? { fill: 'follows speaker', split: 'split screen', fit: 'fit on blur', manual: 'hand-set crop' }[c.layout] || c.layout : '', c.edits ? 'edited' : '',
    `${Math.round(secs)}s`, c.removed_seconds > 0.2 ? `${c.removed_seconds.toFixed(1)}s of ums/pauses cut` : '']
    .filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  return `<div class="card clip"><video controls preload="metadata" src="${url}"></video>${head}
    <div class="tags">${tags}</div><p class="small">${esc(c.reason)}</p>
    <div class="row">${edit}<a class="btn ghost" href="${url}" download="${esc(name)}.mp4">Download</a>
    <a class="btn ghost" href="/api/clips/${c.id}/srt">Subtitles (.srt)</a>${redo}</div></div>`;
}

  a = clamp(a, 0, ED.hi); b = clamp(b, 0, ED.hi);
  if (b - a < 3) { if (b !== ED.end) b = a + 3; else a = b - 3; }
  if (b - a > 180) { if (b !== ED.end) b = a + 180; else a = b - 180; }
  ED.start = Math.round(a * 100) / 100; ED.end = Math.round(b * 100) / 100;
  drawTimeline(); drawChips();
}
function snapT(t, kind) {
  let best = t, d = 0.3;
  for (const w of ED.words) { const x = kind === 'start' ? w.s : w.e; if (Math.abs(x - t) < d) { d = Math.abs(x - t); best = x; } }
  return best;
}
const changedStyle = () => Object.fromEntries(Object.entries(readStyle('ed_')).filter(([k, v]) => String(v).toLowerCase() !== String(ED.style0[k]).toLowerCase()));
function wireTimeline() {
  const tl = $('#tl'), tAt = ev => { const r = tl.getBoundingClientRect(); return ED.lo + clamp((ev.clientX - r.left) / r.width, 0, 1) * (ED.hi - ED.lo); };
  let drag = null;
  for (const [id, kind] of [['hS', 'start'], ['hE', 'end']]) {
    const h = $('#' + id);
    h.addEventListener('pointerdown', ev => { drag = kind; h.setPointerCapture(ev.pointerId); ev.preventDefault(); ev.stopPropagation(); });
    h.addEventListener('pointermove', ev => { if (drag !== kind) return; const t = snapT(tAt(ev), kind);
      kind === 'start' ? setTrim(t, ED.end) : setTrim(ED.start, t); });
    h.addEventListener('pointerup', () => { drag = null; });
  }
  tl.addEventListener('click', ev => { if (ev.target === tl || ev.target.id === 'tlsel') $('#edv').currentTime = tAt(ev); });
}
function drawTimeline() {
  if (!ED) return;
  const v = $('#edv');
  $('#tlsel').style.left = pctT(ED.start); $('#tlsel').style.width = ((ED.end - ED.start) / (ED.hi - ED.lo) * 100) + '%';
  $('#hS').style.left = pctT(ED.start); $('#hE').style.left = pctT(ED.end);
  $('#tlp').style.left = pctT(edT(v.currentTime || 0));
  document.querySelectorAll('.tlbr').forEach(n => n.remove());
  ED.broll.forEach(b => { const n = document.createElement('div'); n.className = 'tlbr';
    n.style.left = pctT(ED.start + b.at); n.style.width = (b.dur / (ED.hi - ED.lo) * 100) + '%'; $('#tl').appendChild(n); });
  if (document.activeElement !== $('#inS')) $('#inS').value = ED.start;
  if (document.activeElement !== $('#inE')) $('#inE').value = ED.end;
  $('#lenInfo').textContent = `Length ${(ED.end - ED.start).toFixed(1)} s (3 to 180 s). Timeline shows ${fmt(ED.lo)} to ${fmt(ED.hi)} of the video.`;
}
function setFromPlayhead(which) { const t = Math.round($('#edv').currentTime * 100) / 100; which === 'start' ? setTrim(t, ED.end) : setTrim(ED.start, t); }
function playSel() { const v = $('#edv'); v.currentTime = ED.start; ED.playing = true; v.play(); }

/* words */
function wordState(w) {
  const t = ED.wordEdits[w.k];
  return { cut: ED.cuts.has(w.k), hid: t === '', edt: t !== undefined && t !== '' && t !== w.w, text: t === undefined || t === '' ? w.w : t };
}
function drawChips() {
  const inClip = ED.words.filter(w => w.e > ED.start && w.s < ED.end);
  $('#chips').innerHTML = inClip.length ? inClip.map(w => { const st = wordState(w);
    return `<button class="chip ${st.cut ? 'cut' : ''} ${st.hid ? 'hid' : ''} ${st.edt ? 'edt' : ''} ${ED.sel === w.k ? 'sel' : ''}" onclick="selWord('${w.k}')">${esc(st.text)}</button>`; }).join('')
    : '<span class="muted small">No words in this stretch.</span>';
  const w = ED.words.find(x => x.k === ED.sel);
  $('#wordTools').innerHTML = !w ? '' : (() => { const st = wordState(w); return `<div class="row">
    <input type="text" id="wordText" value="${esc(st.text)}" style="width:170px" maxlength="60" onchange="editWord(this.value)">
    <button class="btn ghost" onclick="toggleCut()">${st.cut ? 'Keep in video' : 'Cut from video'}</button>
    <button class="btn ghost" onclick="toggleHide()">${st.hid ? 'Show in captions' : 'Hide from captions'}</button>
    <button class="btn ghost" onclick="resetWord()">Reset</button></div>
    <div class="muted small" style="margin-top:4px">${w.s.toFixed(2)} s. Cut words disappear from the picture and sound; captions follow.</div>`; })();
}
function selWord(k) { ED.sel = k; const w = ED.words.find(x => x.k === k); if (w) $('#edv').currentTime = w.s; drawChips(); }
function editWord(t) { const w = ED.words.find(x => x.k === ED.sel); if (!w) return; t = t.trim();
  if (t === '' || t === w.w) delete ED.wordEdits[w.k]; else ED.wordEdits[w.k] = t; drawChips(); }
function toggleCut() { ED.cuts.has(ED.sel) ? ED.cuts.delete(ED.sel) : ED.cuts.add(ED.sel); drawChips(); }
function toggleHide() { ED.wordEdits[ED.sel] === '' ? delete ED.wordEdits[ED.sel] : (ED.wordEdits[ED.sel] = ''); drawChips(); }
function resetWord() { delete ED.wordEdits[ED.sel]; ED.cuts.delete(ED.sel); drawChips(); }

/* crop box */
const edAspect = () => ({ '9:16': 9 / 16, '1:1': 1, '4:5': 4 / 5 })[readVal('ed_output_aspect')] || null;
function toggleCrop(initial) {
  const on = $('#cropOn').checked, a = edAspect();
  $('#cropOn').disabled = !a; $('#cropNote').classList.toggle('hidden', !!a);
  if (on && a && !ED.crop) ED.crop = { cx: 0.5, cy: 0.5, zoom: 1 };
  if (!on) ED.crop = null;
  $('#cropCtl').classList.toggle('hidden', !ED.crop);
  if (ED.crop) $('#zoom').value = ED.crop.zoom;
  if (!initial) drawCrop(); else drawCrop();
}
function drawCrop() {
  const box = $('#cropbox'); if (!box) return;
  const a = edAspect();
  if (!a && ED.crop) { /* shape changed to "original": hand placement is not possible */ ED.crop = null; $('#cropOn').checked = false; $('#cropCtl').classList.add('hidden'); }
  $('#cropOn').disabled = !a; $('#cropNote').classList.toggle('hidden', !!a);
  if (!ED.crop || !ED.nat) { box.style.display = 'none'; return; }
  const { w, h } = ED.nat; let cw, ch;
  if (w / h > a) { ch = h; cw = h * a; } else { cw = w; ch = w / a; }
  const z = ED.crop.zoom, fw = cw / w / z, fh = ch / h / z;
  ED.crop.cx = clamp(ED.crop.cx, fw / 2, 1 - fw / 2); ED.crop.cy = clamp(ED.crop.cy, fh / 2, 1 - fh / 2);
  box.style.display = 'block'; box.style.width = (fw * 100) + '%'; box.style.height = (fh * 100) + '%';
  box.style.left = ((ED.crop.cx - fw / 2) * 100) + '%'; box.style.top = ((ED.crop.cy - fh / 2) * 100) + '%';
  $('#zoomVal').textContent = ED.crop.zoom.toFixed(2) + '×';
}
function wireCrop() {
  const box = $('#cropbox'), wrap = $('#vwrap'); let last = null;
  box.addEventListener('pointerdown', ev => { last = [ev.clientX, ev.clientY]; box.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  box.addEventListener('pointermove', ev => { if (!last || !ED.crop) return; const r = wrap.getBoundingClientRect();
    ED.crop.cx += (ev.clientX - last[0]) / r.width; ED.crop.cy += (ev.clientY - last[1]) / r.height; last = [ev.clientX, ev.clientY]; drawCrop(); });
  box.addEventListener('pointerup', () => { last = null; });
}

/* B-roll */
const baseName = p => String(p).split(/[\\/]/).pop();
async function loadBroll(suggest) {
  const el = $('#brOptions'); el.innerHTML = '<span class="muted small">Looking…</span>';
  try {
    const items = suggest ? (await api('/broll/suggest?clip_id=' + ED.id)).suggestions : (await api('/broll/list')).slice(0, 60);
    ED.brollList = items;
    el.innerHTML = items.length ? items.map((it, i) => `<div class="brl"><img src="/api/broll/thumb?path=${encodeURIComponent(it.path)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="grow"><div>${esc(it.name)}</div><div class="muted small">${it.matched ? 'matches: ' + esc(it.matched.join(', ')) : esc(it.rel)}</div></div>
      ${it.matched ? `<button class="btn ghost" onclick="addBroll(${i}, ${it.at})">Insert at ${fmt(it.at)}</button>` : ''}
      <button class="btn ghost" onclick="addBroll(${i})">Insert at playhead</button></div>`).join('')
      : `<span class="muted small">${suggest ? 'No file names match what is said. Try "Browse all files".' : 'The folder has no videos or pictures.'}</span>`;
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function addBroll(i, at) {
  const it = ED.brollList[i], len = ED.end - ED.start;
  if (at === undefined) at = $('#edv').currentTime - ED.start;
  at = clamp(at, 0, Math.max(len - 0.5, 0));
  const dur = clamp(Number($('#brDur').value) || 3, 0.5, Math.min(15, len - at));
  ED.broll.push({ path: it.path, at: Math.round(at * 100) / 100, dur: Math.round(dur * 100) / 100 });
  drawBrollUsed(); drawTimeline();
}
function drawBrollUsed() {
  const el = $('#brUsed'); if (!el) return;
  el.innerHTML = ED.broll.length ? ED.broll.map((b, i) => `<div class="brl"><div class="grow">${esc(baseName(b.path))}
    <div class="muted small">from ${b.at.toFixed(1)} s into the clip, for ${b.dur.toFixed(1)} s</div></div>
    <button class="btn danger" onclick="ED.broll.splice(${i},1); drawBrollUsed(); drawTimeline()">Remove</button></div>`).join('')
    : '<span class="muted small">None yet.</span>';
}

async function saveEditor() {
  const edits = {};
  const words = Object.fromEntries(Object.entries(ED.wordEdits));
  if (Object.keys(words).length) edits.words = words;
  if (ED.cuts.size) edits.cuts = [...ED.cuts];
  if (ED.crop) edits.crop = ED.crop;
  if (ED.broll.length) edits.broll = ED.broll.map(({ path, at, dur }) => ({ path, at, dur }));
  try {
    await api('/clips/' + ED.id, json('PUT', { title: $('#edTitle').value, start: ED.start, end: ED.end, edits, opts: changedStyle() }));
    go('project', ED.pid);
  } catch (e) { $('#edErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; window.scrollTo(0, 0); }
}

loadSettings().then(() => go('projects'));
</script>
</body>
